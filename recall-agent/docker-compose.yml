services:
  db:
    image: postgres:16-alpine
    container_name: recall-agent-db
    env_file:
      - .env.example
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall_agent -d recall_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: recall-agent-api
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
    container_name: recall-agent-dashboard
    env_file:
      - .env.example
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      - api

volumes:
  postgres_data:
